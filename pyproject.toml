[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "peakcast"
dynamic = ["version"]
description = "Calibrated forecasts of the peak GPU memory of PyTorch training steps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Mateusz Bieniek" },
    { name = "Jaroslaw Kurek" },
]
keywords = ["pytorch", "gpu memory", "batch size", "out of memory", "conformal prediction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.hatch.version]
path = "src/peakcast/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/peakcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA device"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*" = ["E501", "E402"]
